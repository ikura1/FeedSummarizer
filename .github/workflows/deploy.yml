name: Deploy
on:
  workflow_run:
    workflows: ["Lint"]
    branches: ["master", "main"]
    types:
      - completed
jobs:
  build-deploy:
    # Lint が成功した master への push のときだけデプロイする
    # （PR の Lint 完了ではデプロイしない）
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: ${{ secrets.AWS_REGION}}
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          role-session-name: GItHubActions

      - name: get-caller-identity is allowed to run on role.
        run: aws sts get-caller-identity

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Export pinned requirements
        run: |
          # boto3 系は Lambda ランタイムに同梱されているためレイヤーに含めない
          uv export --format requirements-txt -o /tmp/requirements.txt --no-dev \
            --no-emit-package boto3 --no-emit-package botocore --no-emit-package s3transfer

      - name: install dependencies
        run: |
          mkdir python
          uv pip install -r /tmp/requirements.txt --target=python
          zip -r ./dependencies.zip ./python

      - name: publish dependencies
        run: |
          result=$(aws lambda publish-layer-version --layer-name lambda-feedsumarizer --compatible-runtimes python3.13 --zip-file fileb://dependencies.zip)
          LAYER_VERSION_ARN=$(jq -r '.LayerVersionArn' <<< "$result")
          echo "LAYER_VERSION_ARN=$LAYER_VERSION_ARN" >> $GITHUB_ENV

      - name: create deployment package
        run: |
          echo $LAYER_VERSION_ARN
          cd src/FeedSummarizer
          zip ../../code.zip *.py
          cd ../../

      - name: lambda update
        run: |
          aws lambda update-function-code --function-name FeedSummarizer --zip-file fileb://code.zip --region "us-east-1" > /dev/null 2>&1

      - name: lambda update layer
        run: |
          echo $LAYER_VERSION_ARN
          aws lambda wait function-updated --function-name FeedSummarizer --region "us-east-1" > /dev/null 2>&1
          aws lambda update-function-configuration --function-name FeedSummarizer --runtime python3.13 --layers $LAYER_VERSION_ARN --region "us-east-1" > /dev/null 2>&1
