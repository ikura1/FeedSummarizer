[project]
name = "feedsummarizer"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "ikura1", email = "ikura.lab@gmail.com" }
]
dependencies = [
    "feedparser>=6.0.11",
    "openai>=1.23.6",
    "beautifulsoup4>=4.12.3",
    "requests>=2.31.0",
    "boto3>=1.34.93",
    "extractcontent3>=0.0.2",
    "pymupdf>=1.24.7,<2",  # 2.x は onnxruntime 等で Lambda レイヤー上限(250MB)を超える
]
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "black>=23.7.0",
    "pre-commit>=3.3.3",
    "flake8-isort>=6.0.0",
    "flake8>=5.0.4",
    "bandit>=1.7.5",
    "pytest>=8.2.0",
    "moto>=5.0.5",
    "responses>=0.25.0",
    "inline-snapshot>=0.10.2",
    "memory-profiler>=0.61.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/FeedSummarizer"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
# パッケージ名はデプロイ構成に合わせているため N999 を除外
ignore = ["N999"]

[tool.bandit]
exclude_dirs = ["tests/"]
